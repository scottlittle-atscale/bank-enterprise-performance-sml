unique_name: bank_enterprise_performance
object_type: model
label: Bank Enterprise Performance
description: 'Unified enterprise-performance model for a US retail + commercial bank: four lines of business
  over seven conformed dimensions.'
relationships:
- unique_name: deposit_to_snapshot_date
  from:
    dataset: fact_deposit_snapshot
    join_columns:
    - snapshot_date
  to:
    dimension: Date Dimension
    level: Date
  role_play: Snapshot {0}
- unique_name: deposit_to_branch
  from:
    dataset: fact_deposit_snapshot
    join_columns:
    - branch_id
  to:
    dimension: Geography Dimension
    level: Branch
- unique_name: deposit_to_product
  from:
    dataset: fact_deposit_snapshot
    join_columns:
    - product_id
  to:
    dimension: Product Dimension
    level: Product
- unique_name: origination_to_origination_date
  from:
    dataset: fact_loan_origination
    join_columns:
    - origination_date
  to:
    dimension: Date Dimension
    level: Date
  role_play: Origination {0}
- unique_name: origination_to_branch
  from:
    dataset: fact_loan_origination
    join_columns:
    - branch_id
  to:
    dimension: Geography Dimension
    level: Branch
- unique_name: origination_to_product
  from:
    dataset: fact_loan_origination
    join_columns:
    - product_id
  to:
    dimension: Product Dimension
    level: Product
- unique_name: origination_to_customer
  from:
    dataset: fact_loan_origination
    join_columns:
    - customer_id
  to:
    dimension: Customer Dimension
    level: Customer
- unique_name: payment_to_activity_date
  from:
    dataset: fact_payment_transaction
    join_columns:
    - activity_month
  to:
    dimension: Date Dimension
    level: Date
  role_play: Activity {0}
- unique_name: payment_to_product
  from:
    dataset: fact_payment_transaction
    join_columns:
    - product_id
  to:
    dimension: Product Dimension
    level: Product
- unique_name: payment_to_customer
  from:
    dataset: fact_payment_transaction
    join_columns:
    - customer_id
  to:
    dimension: Customer Dimension
    level: Customer
- unique_name: facility_to_snapshot_date
  from:
    dataset: fact_loan_facility_snapshot
    join_columns:
    - snapshot_date
  to:
    dimension: Date Dimension
    level: Date
  role_play: Snapshot {0}
- unique_name: facility_to_product
  from:
    dataset: fact_loan_facility_snapshot
    join_columns:
    - product_id
  to:
    dimension: Product Dimension
    level: Product
- unique_name: facility_to_customer
  from:
    dataset: fact_loan_facility_snapshot
    join_columns:
    - customer_id
  to:
    dimension: Customer Dimension
    level: Customer
- unique_name: facility_to_risk_rating
  from:
    dataset: fact_loan_facility_snapshot
    join_columns:
    - risk_rating_id
  to:
    dimension: Risk Rating Dimension
    level: Rating Grade
dimensions:
- Customer Segment Dimension
- Loan Vintage Dimension
- Delinquency Status Dimension
- FICO Band Dimension
