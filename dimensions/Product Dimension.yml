unique_name: Product Dimension
object_type: dimension
label: Product Dimension
type: standard
description: Conformed product dimension across all four lines of business. product_category groups products;
  snowflakes to dim_line_of_business via lob_id.
hierarchies:
- unique_name: Product Hierarchy
  label: Product Hierarchy
  filter_empty: 'yes'
  levels:
  - unique_name: Segment
  - unique_name: Line of Business
  - unique_name: Product Category
  - unique_name: Product
level_attributes:
- unique_name: Segment
  label: Segment
  dataset: dim_line_of_business
  key_columns:
  - segment
  name_column: segment
- unique_name: Line of Business
  label: Line of Business
  dataset: dim_line_of_business
  key_columns:
  - lob_id
  name_column: lob_name
  is_unique_key: true
  description: 'Bank reporting line of business: Retail Deposits, Consumer Lending, Commercial Payments,
    Commercial Real Estate, Middle Market Lending. Rolls up to segment (Consumer Bank / Commercial Bank).'
- unique_name: Product Category
  label: Product Category
  dataset: dim_product
  key_columns:
  - product_category
  name_column: product_category
- unique_name: Product
  label: Product
  dataset: dim_product
  key_columns:
  - product_id
  name_column: product_name
  is_unique_key: true
relationships:
- unique_name: product_to_lob
  from:
    dataset: dim_product
    join_columns:
    - lob_id
  to:
    level: Line of Business
  type: snowflake
